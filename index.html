<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kindle Clock, Weather & Calendar</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Georgia, "Times New Roman", serif;
            background: #ffffff;
            color: #000000;
        }

        body {
            padding: 0;
            overflow: hidden;
        }

        .screen {
            width: 100vw;
            height: 100vh;
            padding: 6px;
            overflow: hidden;
            transform-origin: center center;
        }

        body.orientation-portrait .screen {
            transform: none;
        }

        body.orientation-portrait-inverted .screen {
            transform: rotate(180deg);
        }

        body.orientation-landscape-left .screen,
        body.orientation-landscape-right .screen {
            width: 100vh;
            height: 100vw;
            min-height: 0;
            position: fixed;
            top: 50%;
            left: 50%;
        }

        body.orientation-landscape-left .screen {
            transform: translate(-50%, -50%) rotate(90deg);
        }

        body.orientation-landscape-right .screen {
            transform: translate(-50%, -50%) rotate(270deg);
        }

        body.landscape-layout .page {
            width: 100%;
            height: 100%;
            max-width: none;
            min-height: 0;
            display: grid;
            grid-template-columns: 0.82fr 1.18fr;
            grid-template-rows: auto 1fr;
            gap: 6px;
            overflow: hidden;
        }

        body.landscape-layout .settings-card {
            grid-column: 1 / span 2;
        }

        body.landscape-layout .dashboard-card {
            grid-column: 1;
            grid-row: 2;
            align-self: stretch;
            overflow: hidden;
        }

        body.landscape-layout .right-column {
            grid-column: 2;
            grid-row: 2;
            align-self: stretch;
            display: grid;
            grid-template-rows: 1.05fr 0.95fr;
            gap: 6px;
            overflow: hidden;
        }

        body.landscape-layout .calendar-card {
            height: 100%;
            align-self: stretch;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        body.landscape-layout .calendar-grid {
            flex: 1;
            grid-auto-rows: 1fr;
        }

        body.landscape-layout .dashboard-main {
            height: 100%;
            grid-template-columns: 1fr;
            grid-template-rows: auto auto;
        }

        body.landscape-layout .time-panel {
            border-right: 0;
            border-bottom: 1px solid #000;
            padding-right: 0;
            padding-bottom: 8px;
        }

        body.landscape-layout #time {
            font-size: 6rem;
        }

        body.landscape-layout #dateLine {
            font-size: 1.5rem;
        }

        body.landscape-layout #worldTimes {
            font-size: 1.5rem;
        }

        body.landscape-layout .weather-place {
            font-size: 1.1rem;
        }

        body.landscape-layout .weather-label {
            font-size: 0.9rem;
        }

        body.landscape-layout .weather-item {
            min-height: 43px;
        }

        body.landscape-layout .weather-value {
            font-size: 2rem;
        }

        body.landscape-layout #weatherStatus {
            font-size: 0.99rem;
        }

        body.landscape-layout .calendar-header {
            padding-bottom: 4px;
            margin-bottom: 4px;
        }

        body.landscape-layout #monthYear {
            font-size: 2.5rem;
        }

        body.landscape-layout .hint {
            font-size: 0.95rem;
        }

        body.landscape-layout .day-name {
            min-height: 0;
            font-size: 0.88rem;
        }

        body.landscape-layout .day {
            min-height: 0;
            font-size: 1.18rem;
        }

        body.landscape-layout .today {
            font-size: 1.34rem;
        }

        body.landscape-layout .quote-card {
            padding: 10px 16px;
        }

        body.landscape-layout .quote-title {
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        body.landscape-layout #quoteText {
            font-size: 1.18rem;
            line-height: 1.22;
        }

        body.landscape-layout #quoteAuthor {
            font-size: 0.98rem;
            margin-top: 10px;
        }

        .page {
            max-width: 600px;
            height: 100%;
            margin: 0 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
        }

        button,
        select {
            border: 2px solid #000;
            background: #fff;
            color: #000;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }

        .tiny-button {
            border: 0;
            background: transparent;
            color: #000;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            font-size: 0.72rem;
            line-height: 1;
            padding: 2px 3px;
            min-width: 0;
            min-height: 0;
        }

        .settings-card,
        .dashboard-card,
        .calendar-card,
        .quote-card {
            border: 2px solid #000;
            background: #fff;
        }

        .settings-card {
            display: none;
            padding: 8px;
        }

        .settings-card.open {
            display: block;
        }

        .settings-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px solid #000;
            padding-bottom: 5px;
        }

        .settings-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-weight: bold;
            font-size: 0.9rem;
        }

        select,
        button {
            font-size: 0.9rem;
            padding: 5px;
        }

        .small-note {
            font-size: 0.78rem;
            font-style: italic;
            line-height: 1.25;
        }

        .dashboard-card {
            padding: 8px;
            position: relative;
        }

        .settings-cog {
            position: absolute;
            top: 3px;
            left: 4px;
            z-index: 2;
            text-decoration: underline;
        }

        .dashboard-main {
            display: grid;
            grid-template-columns: 1.25fr 0.75fr;
            gap: 8px;
            align-items: stretch;
        }

        .time-panel {
            text-align: center;
            border-right: 1px solid #000;
            padding-right: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #time {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 5.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            line-height: 0.95;
            white-space: nowrap;
        }

        #dateLine {
            margin-top: 5px;
            font-size: 1.32rem;
            font-weight: bold;
        }

        #worldTimes {
            margin-top: 5px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            line-height: 1.2;
        }

        .weather-panel {
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 5px;
            min-width: 0;
        }

        .weather-place {
            font-size: 1.05rem;
            font-style: italic;
            text-align: center;
            border-bottom: 1px solid #000;
            padding-bottom: 4px;
        }

        .weather-compact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .weather-item {
            border: 1px solid #000;
            padding: 4px 2px;
            text-align: center;
            min-height: 38px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .weather-item.wide {
            grid-column: 1 / span 2;
        }

        .weather-label {
            font-size: 0.86rem;
            font-weight: bold;
        }

        .weather-value {
            margin-top: 2px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.34rem;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        #weatherStatus {
            font-size: 0.97rem;
            font-style: italic;
            text-align: center;
        }

        .calendar-card {
            padding: 7px;
            flex: 0 0 auto;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
        }

        .quote-card {
            padding: 10px 12px;
            flex: 1;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .quote-title {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.82rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .quote-image-wrap,
        #quoteImage {
            display: none;
        }

        #quoteText {
            font-size: 1.08rem;
            line-height: 1.22;
            font-weight: bold;
            font-style: italic;
            overflow: hidden;
        }

        #quoteAuthor {
            margin-top: 8px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 0.88rem;
            font-weight: bold;
            text-align: center;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #000;
            padding-bottom: 6px;
            margin-bottom: 6px;
        }

        #monthYear {
            font-size: 1.48rem;
            font-weight: bold;
        }

        .hint {
            font-size: 0.72rem;
            font-style: italic;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-left: 1px solid #000;
            border-top: 1px solid #000;
        }

        .day-name,
        .day {
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .day-name {
            min-height: 26px;
            font-weight: bold;
            background: #eeeeee;
            font-size: 0.82rem;
        }

        .day {
            min-height: 32px;
            font-size: 1.08rem;
        }

        .empty {
            background: #f8f8f8;
        }

        .today {
            background: #000;
            color: #fff;
            font-weight: bold;
            font-size: 1.38rem;
        }

        @media (max-width: 430px) {
            .screen {
                padding: 5px;
            }

            .page {
                gap: 6px;
            }

            .dashboard-main {
                grid-template-columns: 1.18fr 0.82fr;
                gap: 6px;
            }

            .time-panel {
                padding-right: 6px;
            }

            #time {
                font-size: 4rem;
            }

            #dateLine {
                font-size: 1.05rem;
            }

            #worldTimes {
                font-size: 1.2rem;
            }

            .weather-value {
                font-size: 1.08rem;
            }

            .weather-label {
                font-size: 0.72rem;
            }

            .weather-item {
                min-height: 34px;
            }

            #monthYear {
                font-size: 1.15rem;
            }

            .day-name {
                min-height: 22px;
                font-size: 0.62rem;
            }

            .day {
                min-height: 28px;
                font-size: 0.88rem;
            }

            #quoteText {
                font-size: 0.92rem;
            }

            #quoteAuthor {
                font-size: 0.78rem;
            }

            .quote-title {
                font-size: 0.72rem;
            }

            .today {
                font-size: 1.05rem;
            }
        }

        @media print {
            .settings-cog,
            .settings-card {
                display: none;
            }
        }
    </style>
</head>
<body>
<div class="screen" id="screen" data-refresh="0">
    <main class="page">
        <section class="settings-card" id="settingsCard">
            <div class="settings-title">Display Settings</div>
            <div class="settings-row">
                <label for="orientationSelect">Orientation:</label>
                <select id="orientationSelect">
                    <option value="portrait">Portrait — normal</option>
                    <option value="portrait-inverted">Portrait — upside down</option>
                    <option value="landscape-left">Landscape — left side</option>
                    <option value="landscape-right">Landscape — right side</option>
                </select>
            </div>
            <div class="settings-row">
                <label for="timeFormatSelect">Time:</label>
                <select id="timeFormatSelect">
                    <option value="24">24-hour</option>
                    <option value="12">12-hour</option>
                </select>
                <button id="closeSettings" type="button">Close</button>
            </div>
            <div class="small-note">Settings are hidden by default. Orientation and time format are saved on this device.</div>
        </section>

        <section class="dashboard-card">
            <button class="tiny-button settings-cog" id="settingsToggle" type="button" aria-label="Settings" title="Settings">SET</button>
            <div class="dashboard-main">
                <div class="time-panel">
                    <div id="time">--:--</div>
                    <div id="worldTimes">NY --:-- | Paris --:--</div>
                    <div id="dateLine">Loading date...</div>
                </div>

                <div class="weather-panel">
                    <div class="weather-place">Rohini / 110085</div>
                    <div class="weather-compact-grid">
                        <div class="weather-item">
                            <div class="weather-label">TEMP</div>
                            <div class="weather-value" id="temperature">--°C</div>
                        </div>
                        <div class="weather-item">
                            <div class="weather-label">WIND</div>
                            <div class="weather-value" id="wind">--</div>
                        </div>
                        <div class="weather-item wide">
                            <div class="weather-label">SKY</div>
                            <div class="weather-value" id="weatherText">--</div>
                        </div>
                    </div>
                    <div id="weatherStatus">Loading weather...</div>
                </div>
            </div>
        </section>

        <div class="right-column">
            <section class="calendar-card">
                <div class="calendar-header">
                    <div id="monthYear">Month Year</div>
                    <div class="hint">Month</div>
                </div>
                <div class="calendar-grid" id="calendar"></div>
            </section>

            <section class="quote-card">
                <div class="quote-title">Quote</div>
                <div id="quoteText">Loading quote...</div>
                <div id="quoteAuthor">—</div>
            </section>
        </div>
    </main>
</div>

<script>
    const HARD_CODED_LATITUDE = 28.7039;
    const HARD_CODED_LONGITUDE = 77.0949;

    // Quoterism is called through this Cloudflare Worker proxy.
    // The API key should stay inside the Worker, not inside this Kindle page.
    const QUOTERISM_PROXY_URL = "https://quiet-truth-46fd.old-smoke-1eab.workers.dev/";

    const screenElement = document.getElementById("screen");
    const settingsToggle = document.getElementById("settingsToggle");
    const settingsCard = document.getElementById("settingsCard");
    const closeSettings = document.getElementById("closeSettings");
    const orientationSelect = document.getElementById("orientationSelect");
    const timeFormatSelect = document.getElementById("timeFormatSelect");
    const timeElement = document.getElementById("time");
    const dateLineElement = document.getElementById("dateLine");
    const worldTimesElement = document.getElementById("worldTimes");
    const monthYearElement = document.getElementById("monthYear");
    const calendarElement = document.getElementById("calendar");
    const temperatureElement = document.getElementById("temperature");
    const windElement = document.getElementById("wind");
    const weatherTextElement = document.getElementById("weatherText");
    const weatherStatusElement = document.getElementById("weatherStatus");
    const quoteTextElement = document.getElementById("quoteText");
    const quoteAuthorElement = document.getElementById("quoteAuthor");


    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const monthNames = [
        "January", "February", "March", "April", "May", "June",
        "July", "August", "September", "October", "November", "December"
    ];

    const weatherDescriptions = {
        0: "Clear",
        1: "Clear",
        2: "Cloudy",
        3: "Cloudy",
        45: "Fog",
        48: "Fog",
        51: "Drizzle",
        53: "Drizzle",
        55: "Drizzle",
        61: "Rain",
        63: "Rain",
        65: "Rain",
        71: "Snow",
        73: "Snow",
        75: "Snow",
        80: "Showers",
        81: "Showers",
        82: "Showers",
        95: "Storm",
        96: "Storm",
        99: "Storm"
    };


    let lastRenderedMonth = null;
    let lastRenderedYear = null;
    let timeFormat = "24";
    let wakeLock = null;
    let refreshSignal = 0;
    let lastQuoteHourKey = "";

    function pad(number) {
        return number.toString().padStart(2, "0");
    }

    async function tryKeepAwake() {
        // Best effort only: Kindle firmware may still sleep after its own timeout.
        if ("wakeLock" in navigator && navigator.wakeLock && navigator.wakeLock.request) {
            try {
                wakeLock = await navigator.wakeLock.request("screen");
            } catch (error) {
                wakeLock = null;
            }
        }
    }

    function tinyRefreshSignal() {
        // Gives the page a tiny state change. This does not guarantee preventing Kindle sleep.
        refreshSignal = refreshSignal === 0 ? 1 : 0;
        screenElement.setAttribute("data-refresh", String(refreshSignal));
    }

    function getISTNow() {
        // Kindle browsers may use the wrong device timezone.
        // IST is fixed at UTC+5:30, so this keeps the main clock correct for India.
        return new Date(Date.now() + 330 * 60 * 1000);
    }

    function formatTimeFromParts(hours, minutes) {
        if (timeFormat === "12") {
            const suffix = hours >= 12 ? "PM" : "AM";
            let displayHours = hours % 12;
            if (displayHours === 0) displayHours = 12;
            return `${displayHours}:${pad(minutes)} ${suffix}`;
        }

        return `${pad(hours)}:${pad(minutes)}`;
    }

    function formatISTTime(istNow) {
        return formatTimeFromParts(istNow.getUTCHours(), istNow.getUTCMinutes());
    }

    function formatWorldTime(timeZone) {
        try {
            const formatter = new Intl.DateTimeFormat("en-US", {
                timeZone: timeZone,
                hour: "numeric",
                minute: "2-digit",
                hour12: timeFormat === "12"
            });

            return formatter.format(new Date()).replace(" ", "");
        } catch (error) {
            return "--:--";
        }
    }

    function applyOrientation(value) {
        document.body.classList.remove(
            "orientation-portrait",
            "orientation-portrait-inverted",
            "orientation-landscape-left",
            "orientation-landscape-right",
            "landscape-layout"
        );

        document.body.classList.add(`orientation-${value}`);

        if (value === "landscape-left" || value === "landscape-right") {
            document.body.classList.add("landscape-layout");
        }

        localStorage.setItem("kindleOrientation", value);
    }

    function applyTimeFormat(value) {
        timeFormat = value;
        localStorage.setItem("kindleTimeFormat", value);
        updateClock();
    }

    function loadSavedSettings() {
        const savedOrientation = localStorage.getItem("kindleOrientation") || localStorage.getItem("kindleLayout") || "portrait";
        const savedTimeFormat = localStorage.getItem("kindleTimeFormat") || "24";

        orientationSelect.value = savedOrientation;
        timeFormatSelect.value = savedTimeFormat;
        timeFormat = savedTimeFormat;
        applyOrientation(savedOrientation);
    }

    function updateClock() {
        const istNow = getISTNow();
        const istDay = istNow.getUTCDay();
        const istDate = istNow.getUTCDate();
        const istMonth = istNow.getUTCMonth();
        const istYear = istNow.getUTCFullYear();

        timeElement.textContent = formatISTTime(istNow);
        worldTimesElement.textContent = `NY ${formatWorldTime("America/New_York")} | Paris ${formatWorldTime("Europe/Paris")}`;

        const dayName = dayNames[istDay];
        const month = monthNames[istMonth];
        dateLineElement.textContent = `${dayName}, ${istDate} ${month} ${istYear}`;

        if (lastRenderedMonth !== istMonth || lastRenderedYear !== istYear) {
            renderCalendar(istYear, istMonth, istDate);
            lastRenderedMonth = istMonth;
            lastRenderedYear = istYear;
        } else {
            highlightToday(istDate);
        }
    }

    function renderCalendar(year, month, todayDate) {
        calendarElement.innerHTML = "";
        monthYearElement.textContent = `${monthNames[month]} ${year}`;

        dayNames.forEach(day => {
            const cell = document.createElement("div");
            cell.className = "day-name";
            cell.textContent = day;
            calendarElement.appendChild(cell);
        });

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
            const emptyCell = document.createElement("div");
            emptyCell.className = "day empty";
            calendarElement.appendChild(emptyCell);
        }

        for (let date = 1; date <= daysInMonth; date++) {
            const cell = document.createElement("div");
            cell.className = "day";
            cell.textContent = date;
            cell.dataset.date = date;

            if (date === todayDate) {
                cell.classList.add("today");
            }

            calendarElement.appendChild(cell);
        }
    }

    function highlightToday(todayDate) {
        document.querySelectorAll(".day[data-date]").forEach(cell => {
            cell.classList.toggle("today", Number(cell.dataset.date) === todayDate);
        });
    }

    function setFallbackQuote(message) {
        quoteTextElement.textContent = message || "Add your Quoterism API key to show hourly quotes.";
        quoteAuthorElement.textContent = "Quoterism";
    }

    function pickQuoteFromResponse(data) {
        // Handles common API shapes:
        // 1) [quote, quote]
        // 2) { quotes: [quote, quote] }
        // 3) { data: [quote, quote] }
        // 4) { results: [quote, quote] }
        // 5) single quote object
        let quotes = [];

        if (Array.isArray(data)) {
            quotes = data;
        } else if (data && Array.isArray(data.quotes)) {
            quotes = data.quotes;
        } else if (data && Array.isArray(data.data)) {
            quotes = data.data;
        } else if (data && Array.isArray(data.results)) {
            quotes = data.results;
        } else if (data && typeof data === "object") {
            quotes = [data];
        }

        if (!quotes.length) {
            return null;
        }

        const istNow = getISTNow();
        const index = (istNow.getUTCDate() * 24 + istNow.getUTCHours()) % quotes.length;
        return quotes[index];
    }

    function getQuoteText(quote) {
        return quote.text || quote.quote || quote.content || quote.body || "No quote text returned.";
    }

    function getQuoteAuthorName(quote) {
        if (quote.author && typeof quote.author === "string") return quote.author;
        if (quote.author && quote.author.name) return quote.author.name;
        if (quote.person && quote.person.name) return quote.person.name;
        if (quote.by) return quote.by;
        if (quote.name) return quote.name;
        return "Unknown";
    }

    function getQuoteImageUrl(quote) {
        if (quote.author && quote.author.imageUrl) return quote.author.imageUrl;
        if (quote.author && quote.author.image) return quote.author.image;
        if (quote.person && quote.person.imageUrl) return quote.person.imageUrl;
        if (quote.person && quote.person.image) return quote.person.image;
        if (quote.imageUrl) return quote.imageUrl;
        if (quote.image) return quote.image;
        if (quote.authorImage) return quote.authorImage;
        return "";
    }

    async function fetchQuote(force) {
        const istNow = getISTNow();
        const hourKey = `${istNow.getUTCFullYear()}-${istNow.getUTCMonth()}-${istNow.getUTCDate()}-${istNow.getUTCHours()}`;

        if (!force && lastQuoteHourKey === hourKey) {
            return;
        }

        try {
            const response = await fetch(QUOTERISM_PROXY_URL, {
                method: "GET",
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("Quote service error");
            }

            const data = await response.json();
            const quote = pickQuoteFromResponse(data);

            if (!quote) {
                throw new Error("No quote returned");
            }

            quoteTextElement.textContent = `“${getQuoteText(quote)}”`;
            quoteAuthorElement.textContent = `— ${getQuoteAuthorName(quote)}`;


            lastQuoteHourKey = hourKey;
        } catch (error) {
            setFallbackQuote("Quote unavailable. Check Worker, API key, or Wi‑Fi.");
        }
    }

    async function fetchWeather() {
        weatherStatusElement.textContent = "Loading weather...";

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${HARD_CODED_LATITUDE}&longitude=${HARD_CODED_LONGITUDE}&current_weather=true&timezone=auto`;

        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error("Weather service error");
            }

            const data = await response.json();
            const current = data.current_weather;

            temperatureElement.textContent = `${Math.round(current.temperature)}°C`;
            windElement.textContent = `${Math.round(current.windspeed)} km/h`;
            weatherTextElement.textContent = weatherDescriptions[current.weathercode] || "OK";

            const updateTime = new Date(current.time);
            weatherStatusElement.textContent = `Updated ${pad(updateTime.getHours())}:${pad(updateTime.getMinutes())}`;
            fetchQuote(false);
        } catch (error) {
            weatherStatusElement.textContent = "Weather unavailable. Check Wi‑Fi.";
        }
    }

    settingsToggle.addEventListener("click", () => {
        settingsCard.classList.toggle("open");
        tryKeepAwake();
    });

    closeSettings.addEventListener("click", () => {
        settingsCard.classList.remove("open");
    });

    orientationSelect.addEventListener("change", () => {
        applyOrientation(orientationSelect.value);
    });

    timeFormatSelect.addEventListener("change", () => {
        applyTimeFormat(timeFormatSelect.value);
    });

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
            tryKeepAwake();
            updateClock();
        }
    });

    document.addEventListener("click", tryKeepAwake);
    document.addEventListener("touchstart", tryKeepAwake);
    document.addEventListener("keydown", tryKeepAwake);

    loadSavedSettings();
    updateClock();
    fetchQuote(true);
    fetchWeather();
    tryKeepAwake();

    // Updates every minute and aligns close to the next minute change.
    const millisecondsUntilNextMinute = (60 - new Date().getSeconds()) * 1000;
    setTimeout(() => {
        updateClock();
        tinyRefreshSignal();
        setInterval(() => {
            updateClock();
            fetchQuote(false);
            tinyRefreshSignal();
            tryKeepAwake();
        }, 60 * 1000);
    }, millisecondsUntilNextMinute);

    // Weather refreshes every 30 minutes.
    setInterval(fetchWeather, 30 * 60 * 1000);
</script>
</body>
</html>
